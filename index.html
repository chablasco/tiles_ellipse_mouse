<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CB Tiles Ellipse Color Switch</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script>
    let bgColor;
    let ellipseColor;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      noStroke();
      randomizeColors();
    }

    function draw() {
      background(bgColor);
      fill(ellipseColor);

      let tilesX = floor(mouseX / 10) || 1;
      let tilesY = floor(mouseY / 10) || 1;

      let tileW = width / tilesX;
      let tileH = height / tilesY;

      for (let x = 0; x < tilesX; x++) {
        for (let y = 0; y < tilesY; y++) {
          ellipse(x * tileW + tileW / 2, y * tileH + tileH / 2, tileW, tileH);
        }
      }
    }

    function keyPressed() {
      if (key === 's' || key === 'S') {
        saveCanvas('cb_tiles_colored', 'png');
      }

      if (key === 'c' || key === 'C') {
        randomizeColors();
      }
    }

    function randomizeColors() {
      do {
        bgColor = color(random(255), random(255), random(255));
        ellipseColor = color(random(255), random(255), random(255));
      } while (colorsAreEqual(bgColor, ellipseColor));
    }

    function colorsAreEqual(c1, c2) {
      return red(c1) === red(c2) &&
             green(c1) === green(c2) &&
             blue(c1) === blue(c2);
    }

    function mousePressed() {
      fullscreen(!fullscreen());
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
